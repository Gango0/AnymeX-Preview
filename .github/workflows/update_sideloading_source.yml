name: Update Sideloading Source

on:
  workflow_run:
    workflows:
      - "changelog"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update when running manually"
        required: false
        default: "beta"

permissions:
  contents: write

jobs:
  update-source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'beta' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'beta' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update sideloading source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python repo/update_source.py

      - name: Commit and push changes
        run: |
          SOURCE_FILE=$(python -c "import json; print(json.load(open('repo/config.json'))['json_file'])")

          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name "github-actions"

          git add "$SOURCE_FILE"
          if git diff --staged --quiet; then
            echo "Source already up to date, nothing to commit."
            exit 0
          fi

          git commit -m "chore: update sideloading source"

          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" && \
              git push origin HEAD:"$TARGET_BRANCH" && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done

          echo "::error::Could not push the updated source after 3 attempts"
          exit 1
